name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check .

      # Ruff does not resolve imports, so deleting a module while an importer
      # remains passes lint and then crash-loops the container at boot. This
      # import is the only thing in CI that catches that class of failure.
      - name: Import smoke test
        env:
          DEV_MODE: "true"
          SECRET_KEY: "ci-only-not-a-real-secret"
          DATABASE_URL: "sqlite:///./ci.db"
        run: python -c "import app.main"

      # Catches batch_alter_table mistakes on SQLite before they reach the
      # production Postgres, and proves every migration is reversible.
      - name: Migration round-trip
        env:
          DEV_MODE: "true"
          SECRET_KEY: "ci-only-not-a-real-secret"
          DATABASE_URL: "sqlite:///./ci.db"
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base

      - name: Check formatting with Ruff
        run: ruff format --check .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
