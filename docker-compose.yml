# Self-hosted Askesis for your home server, exposed on the tailnet under its OWN
# hostname via a Tailscale sidecar (so it installs as its own PWA — a different
# port on a shared host collides with other PWAs on Android).
#
# **This file runs on the home server, not on a dev machine.** It is the production
# stack, `deploy.sh` is what drives it, and it deliberately requires real
# secrets — so it will not even load anywhere else. Local development uses
# ./run-dev.sh, and the containerised frontend toolchain is a separate file,
# docker-compose.dev.yml.
#
#   cp .env.example .env   # fill in secrets + TS_AUTHKEY
#   ./deploy.sh
#   # → https://askesis.<your-tailnet>.ts.net   (HTTPS via Tailscale Serve)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: askesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: askesis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askesis -d askesis"]
      interval: 5s
      timeout: 5s
      retries: 12
    # The ONLY thing spanning both networks. The MCP service reaches Postgres
    # and nothing else; see the mcpnet comment at the bottom of this file.
    networks: [default, mcpnet]

  # Tailscale sidecar: joins the tailnet as "askesis" -> askesis.<tailnet>.ts.net,
  # terminates HTTPS via Tailscale Serve, and proxies to the app over a Unix
  # socket on the shared ./data/run mount. Userspace mode = no extra
  # host caps/devices needed. TS_ACCEPT_DNS=false keeps Docker's DNS so the app can
  # still resolve the `db` service.
  tailscale:
    # Pinned, not :latest. Serve's `unix:` proxy target is the whole reason the
    # app has no TCP port; `docker compose up` does not re-pull a floating tag,
    # so :latest would mean "whatever was on this box first" for the one
    # dependency this design rests on. Verified against v1.102.x.
    image: tailscale/tailscale:v1.102.4
    hostname: askesis
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: askesis
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
      # The app's listening socket. Both containers share a NETWORK namespace
      # but not a filesystem, so the socket needs a mount on both sides.
      - ./data/run:/run/askesis
    restart: unless-stopped
    networks: [default]

  app:
    # GIT_SHA/GIT_REF are exported by deploy.sh and baked into the image so the
    # container can report what it is (GET /api/version). .dockerignore excludes
    # .git/, so there is no way for the build to work this out for itself.
    # They default to "unknown" — a bare `docker compose build` still works.
    build:
      context: .
      # EXPLICIT target, and it must stay explicit. The Dockerfile's last stage is
      # `mcp`, and a build with no target silently builds the LAST stage — which
      # would hand the app container the MCP image: no routers, no SPA, no
      # app.main. release.sh caught this, but only because that check exists.
      target: app
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_REF: ${GIT_REF:-unknown}
    restart: unless-stopped
    # App secrets / config come from .env (read into the container as env vars).
    env_file: .env
    # DATABASE_URL is fixed to the bundled db service and overrides any value in .env.
    environment:
      DATABASE_URL: postgresql://askesis:${POSTGRES_PASSWORD}@db:5432/askesis
      # Listen on a Unix socket instead of a TCP port. Unsetting this reverts
      # the image to a loopback TCP bind — but see the CAUTION below: reverting
      # here alone takes the app down, because serve.json dials the socket.
      APP_SOCKET: /run/askesis/app.sock
    # Share the Tailscale sidecar's network namespace: no host ports are
    # published, and Serve reaches the app over the Unix socket below.
    #
    # Sharing the namespace is exactly why there is no TCP port. In userspace
    # mode tailscaled forwards EVERY inbound tailnet connection to 127.0.0.1 on
    # the same port, with no allowlist — so binding loopback does not close a
    # port (v1.2.5 tried that; :8000 still answered). Only having nothing
    # listening on TCP does.
    #
    # CAUTION: APP_SOCKET above and the Proxy target in tailscale/serve.json are
    # one setting in two files. Changing either alone yields a 502 on every
    # request. To roll back, revert BOTH, then `docker compose down && up -d`.
    network_mode: service:tailscale
    depends_on:
      db:
        condition: service_healthy
      tailscale:
        condition: service_started
    # Progress/meal photos live on the server's own disk. A bind mount, not a
    # named volume: the operator needs to drop a Drive export into
    # ./data/uploads/_inbox/ from the host and run scripts/adopt_photos.py.
    # See SELF_HOSTING.md ("Photo storage") for the one-time copy out of the
    # old `uploads` named volume.
    volumes:
      - ./data/uploads:/app/backend/uploads
      # Where uvicorn creates its listening socket, shared with the sidecar.
      # A bind mount, not a named volume: the operator can inspect it from the
      # host, and `docker volume prune` cannot orphan it.
      - ./data/run:/run/askesis
      # Garmin session token. A named volume, not a bind mount: the client
      # writes it 0600 inside a 0700 dir and nothing on the host should need to
      # read it. Losing it costs a re-login, and Garmin rate-limits those.
      - garmin-tokens:/app/backend/.garminconnect

  # ── The MCP connector (Claude Cowork) ──────────────────────────────────────
  # Its own sidecar, its own tailnet hostname, its own Funnel. The app's sidecar
  # is NOT Funnel'd and must never be.
  #
  # Both services are behind `profiles: ["mcp"]` and every variable below uses
  # `:-` rather than `:?`. That combination is deliberate: compose interpolates
  # the ENTIRE file before running anything, so a `${VAR:?}` here would make
  # `docker compose up` fail for the *app* on any box that has not configured
  # the connector. `profiles:` alone does not help — it gates startup, not
  # interpolation. An unset value therefore reaches the container, where
  # mcp_server/config.py fails closed with a readable reason.
  #
  # Enable with COMPOSE_PROFILES=mcp in .env.
  tailscale-mcp:
    image: tailscale/tailscale:v1.102.4
    hostname: askesis-mcp
    environment:
      # A SEPARATE auth key from the app's, created with the tag that carries
      # `funnel` in the tailnet ACL. Separate so revoking one does not kill both,
      # and so only this node can ever be exposed publicly.
      TS_AUTHKEY: ${TS_AUTHKEY_MCP:-}
      TS_HOSTNAME: askesis-mcp
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve-mcp.json
    # Only runs when asked for. Set COMPOSE_PROFILES=mcp in .env to enable, so
    # `deploy.sh` needs no new flag.
    profiles: ["mcp"]
    volumes:
      - tailscale-mcp-state:/var/lib/tailscale
      - ./tailscale/serve-mcp.json:/config/serve-mcp.json:ro
      - ./data/run-mcp:/run/askesis-mcp
    restart: unless-stopped
    networks: [mcpnet]

  mcp:
    build:
      context: .
      target: mcp
    restart: unless-stopped
    # NO `env_file: .env` — deliberately, and this is the single most important
    # line in this service. That file holds SECRET_KEY (which signs the app's
    # session cookies), TS_AUTHKEY, GEMINI_API_KEY and GARMIN_PASSWORD. The one
    # container facing the public internet receives none of them: every value
    # below is named explicitly, and MCP_TOKEN_SECRET is asserted != SECRET_KEY
    # at startup. A fully compromised MCP container cannot mint an app cookie.
    environment:
      # Its OWN database role: SELECT on the health tables, write only on the
      # three mcp_* tables, and NO write on `users` at all. Create it with
      # backend/scripts/mcp_db_role.sql — without it an RCE here could rewrite
      # password_hash and walk into the real app.
      DATABASE_URL: postgresql://askesis_mcp:${MCP_DB_PASSWORD:-}@db:5432/askesis
      # Signs MCP access tokens. Must differ from the app's SECRET_KEY.
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-}
      # A throwaway, NOT the app's. app/database.py calls get_settings() at
      # module scope and sys.exit(1)s silently on the placeholder, so this
      # process needs *a* value; it signs nothing here.
      SECRET_KEY: ${MCP_APP_SECRET_KEY:-}
      # Must match the connector URL character for character, no trailing slash.
      MCP_PUBLIC_ORIGIN: ${MCP_PUBLIC_ORIGIN:-}
      # Total auth bypass; the config guard refuses to start if this is true.
      DEV_MODE: "false"
      MCP_SOCKET: /run/askesis-mcp/mcp.sock
    profiles: ["mcp"]
    volumes:
      - ./data/run-mcp:/run/askesis-mcp
    # Shares the MCP sidecar's netns, so it has no route to the app's sidecar.
    # Verify: `docker compose exec mcp getent hosts tailscale` must FAIL.
    network_mode: service:tailscale-mcp
    depends_on:
      db:
        condition: service_healthy
      tailscale-mcp:
        condition: service_started

# `default` carries db + the app and its sidecar. `mcpnet` carries db + the MCP
# service and its sidecar. `db` is the only member of both, so the internet-
# facing container has no network path to the app — which today would answer
# unauthenticated at the network layer. Verify after any change to this file:
#     docker compose exec mcp getent hosts tailscale   # must fail
networks:
  default:
  mcpnet:

volumes:
  pgdata:
  tailscale-state:
  garmin-tokens:
  tailscale-mcp-state:
