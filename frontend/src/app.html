<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts are self-hosted (static/fonts + src/fonts.css). Nothing here may
         point at an external host: this app runs on a Tailscale-only box with
         no route to the internet, and a remote font link blocks text rendering
         until it times out. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- Without this, nothing reads the manifest. vite-plugin-pwa generates and
         serves /manifest.webmanifest, but SvelteKit renders this file verbatim
         and the plugin does not inject the link into it — so the manifest was
         being served and never fetched.

         The visible symptom was Android: with no manifest, Chrome cannot see
         `purpose: "any maskable"`, falls back to the <link rel="icon"> favicon
         above, and installs it the legacy way — white plate, icon shrunk to
         two-thirds, centred. Three rounds of icon edits could not fix that,
         because the icons were never the thing being read. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
    <title>Askesis</title>
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-surface-light dark:bg-surface-dark text-gray-900 dark:text-gray-100">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
